<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLY SCOTT VIP ENGINE | WEB PAIRING</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            border: 2px solid #00ff66;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
            background: #111827;
            border-radius: 10px;
        }
        h1 {
            color: #fff;
            text-shadow: 0 0 10px #00ff66;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            background: #030712;
            border: 1px solid #00ff66;
            color: #00ff66;
            text-align: center;
            font-size: 16px;
            border-radius: 5px;
            outline: none;
        }
        input::placeholder {
            color: #374151;
        }
        button {
            background: #00ff66;
            color: #000;
            padding: 12px 25px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 15px;
            width: 95%;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover {
            background: #00cc52;
            box-shadow: 0 0 15px #00ff66;
        }
        #result-box {
            margin-top: 20px;
            padding: 15px;
            background: #030712;
            border: 1px dashed #00ff66;
            display: none;
            border-radius: 5px;
        }
        .code-display {
            font-size: 26px;
            color: #fff;
            font-weight: bold;
            letter-spacing: 3px;
            margin-top: 10px;
            text-shadow: 0 0 10px #00ff66;
        }
        .badge {
            background: #00ff66;
            color: #000;
            padding: 5px 10px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            font-size: 11px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💀 ALLY SCOTT WEB PAIRING 💀</h1>
        <p>Enter your WhatsApp number with country code (e.g., 2557xxxxxxxx) to generate your linking code.</p>
        
        <div id="form-section">
            <input type="text" id="phone" placeholder="2557xxxxxxxx" autocomplete="off">
            <br>
            <button onclick="requestPairingCode()">GET PAIRING CODE</button>
        </div>

        <div id="result-box">
            <p style="margin: 0; color: #9ca3af;">Your Pairing Code:</p>
            <div class="code-display" id="pairing-code">---</div>
            <p style="font-size: 11px; margin-top: 10px; color: #00ff66;">Copy this code and link it on your WhatsApp Linked Devices!</p>
        </div>

        <div class="badge">POWERED BY ALLY SCOTT TECH</div>
    </div>

    <script>
        async function requestPairingCode() {
            const phone = document.getElementById('phone').value.trim();
            const btn = document.querySelector('button');
            const resultBox = document.getElementById('result-box');
            const codeDisplay = document.getElementById('pairing-code');

            if (!phone) {
                alert('Please enter your phone number!');
                return;
            }

            btn.innerText = 'REQUESTING CODE...';
            btn.disabled = true;

            try {
                const response = await fetch('/get-code?phone=' + encodeURIComponent(phone));
                const data = await response.json();

                if (data.success) {
                    codeDisplay.innerText = data.code;
                    resultBox.style.display = 'block';
                    btn.innerText = 'CODE GENERATED ✅';
                } else {
                    alert('Failed: ' + (data.error || 'Please try again.'));
                    btn.innerText = 'GET PAIRING CODE';
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Network connection error occurred.');
                btn.innerText = 'GET PAIRING CODE';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
