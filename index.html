<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALLY SCOTT VIP ENGINE - PAIRING</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; border: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; }
    p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .input-group { margin-bottom: 20px; text-align: left; }
    label { font-size: 13px; color: #cbd5e1; display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #0284c7; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { background: #0369a1; }
    .code-box { margin-top: 25px; background: #0f172a; padding: 20px; border-radius: 10px; border: 2px dashed #0284c7; display: none; }
    .code-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .code { font-size: 32px; font-weight: bold; color: #4ade80; letter-spacing: 4px; margin-top: 8px; }
    .footer { margin-top: 24px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>

  <div class="card">
    <h1>ALLY SCOTT VIP ENGINE</h1>
    <p class="sub">WhatsApp Bot Web Pairing Interface</p>

    <div class="input-group">
      <label for="phone">Enter WhatsApp Phone Number (with Country Code)</label>
      <input type="text" id="phone" placeholder="e.g. 255712345678">
    </div>

    <button onclick="getPairingCode()">REQUEST PAIRING CODE</button>

    <div class="code-box" id="codeBox">
      <div class="code-title">Your WhatsApp Pairing Code</div>
      <div class="code" id="pairCode">--------</div>
    </div>

    <div class="footer">Powered by ALLY SCOTT TECH</div>
  </div>

  <script>
    async function getPairingCode() {
      const phone = document.getElementById('phone').value.trim();
      if (!phone) {
        alert('Please enter a valid phone number!');
        return;
      }

      const codeBox = document.getElementById('codeBox');
      const pairCode = document.getElementById('pairCode');
      pairCode.innerText = 'GENERATING...';
      pairCode.style.color = '#eab308';
      codeBox.style.display = 'block';

      try {
        const res = await fetch(`/pair?number=${encodeURIComponent(phone)}`);
        const data = await res.json();

        if (data.code) {
          pairCode.innerText = data.code;
          pairCode.style.color = '#4ade80';
        } else {
          pairCode.innerText = 'ERROR';
          pairCode.style.color = '#ef4444';
          alert(data.error || 'Failed to get code.');
        }
      } catch (err) {
        pairCode.innerText = 'FAILED';
        pairCode.style.color = '#ef4444';
        alert('Server error! Check node backend.');
      }
    }
  </script>
</body>
</html>
