<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLY SCOTT VIP | PAIRING</title>
    <style>
        body { background: #030712; color: #22c55e; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #0f172a; padding: 30px; border-radius: 10px; box-shadow: 0 0 25px rgba(34, 197, 94, 0.2); text-align: center; border: 1px solid #166534; width: 320px; }
        input { padding: 12px; width: 85%; margin: 15px 0; border-radius: 5px; border: 1px solid #15803d; background: #030712; color: #fff; font-size: 15px; outline: none; text-align: center; }
        button { background: #15803d; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.3s; width: 100%; }
        button:hover { background: #16a34a; box-shadow: 0 0 12px #22c55e; }
        #code { margin-top: 18px; font-size: 20px; color: #4ade80; font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ ALLY SCOTT VIP ⚡</h2>
        <p style="color: #94a3b8; font-size: 12px;">ENTER NUMBER (2557XXXXXXXX)</p>
        <input type="text" id="number" placeholder="2557XXXXXXXX">
        <button onclick="getPairCode()">GET PAIR CODE</button>
        <div id="code"></div>
    </div>
    <script>
        async function getPairCode() {
            const num = document.getElementById('number').value;
            const codeDiv = document.getElementById('code');
            if(!num) { codeDiv.innerText = "⚠️ Enter number!"; return; }
            codeDiv.innerText = "⏳ Connecting...";
            try {
                const res = await fetch(`/pair?number=${num}`);
                const data = await res.json();
                if(data.code) {
                    codeDiv.innerText = `CODE: ${data.code}`;
                } else {
                    codeDiv.innerText = `❌ Error: ${data.error || 'Failed'}`;
                }
            } catch(e) {
                codeDiv.innerText = "❌ Network error!";
            }
        }
    </script>
</body>
</html>
